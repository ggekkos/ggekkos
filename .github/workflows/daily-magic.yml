name: ✦ daily magic

on:
  schedule:
    - cron: "7 3 * * *"   # every day at 00:07 Brazil time
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily-magic.yml"

permissions:
  contents: write

concurrency:
  group: daily-magic
  cancel-in-progress: false

jobs:
  magic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cast today's spells
        run: python3 scripts/daily_magic.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Save the grimoire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new today"
          else
            git commit -m "✦ daily magic · $(TZ=America/Sao_Paulo date +%Y-%m-%d)"
            git push
          fi
