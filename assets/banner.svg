<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0f2e"/>
      <stop offset="0.55" stop-color="#3b1736"/>
      <stop offset="1" stop-color="#6b2133"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plaque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf0d9"/>
      <stop offset="1" stop-color="#efd9b4"/>
    </linearGradient>
    <linearGradient id="lanternBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e0f25"/>
      <stop offset="0.5" stop-color="#e3243b"/>
      <stop offset="1" stop-color="#9e0f25"/>
    </linearGradient>
    <path id="petal" d="M0 -6 C5 -4 6 3 0 6 C-6 3 -5 -4 0 -6 Z"/>
    <g id="lantern">
      <ellipse cx="0" cy="22" rx="48" ry="48" fill="url(#lanternGlow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <rect x="-11" y="-6" width="22" height="7" rx="2" fill="#e8b04a"/>
      <ellipse cx="0" cy="22" rx="22" ry="25" fill="url(#lanternBody)"/>
      <ellipse cx="0" cy="22" rx="11" ry="25" fill="none" stroke="#7a0a1c" stroke-width="1.5"/>
      <line x1="-22" y1="22" x2="22" y2="22" stroke="#7a0a1c" stroke-width="1" opacity="0.5"/>
      <rect x="-11" y="44" width="22" height="7" rx="2" fill="#e8b04a"/>
      <line x1="0" y1="51" x2="0" y2="70" stroke="#e8b04a" stroke-width="2"/>
      <path d="M-4 66 L0 80 L4 66 Z" fill="#e8b04a"/>
    </g>
    <g id="sprig">
      <path d="M0 0 C-4 -40 6 -80 0 -120" fill="none" stroke="#3f7a57" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="-12" cy="-30" rx="13" ry="5" fill="#5fa37a" transform="rotate(-30 -12 -30)"/>
      <ellipse cx="12" cy="-52" rx="13" ry="5" fill="#6fb88a" transform="rotate(30 12 -52)"/>
      <ellipse cx="-11" cy="-74" rx="12" ry="5" fill="#5fa37a" transform="rotate(-35 -11 -74)"/>
      <ellipse cx="10" cy="-96" rx="11" ry="4.5" fill="#6fb88a" transform="rotate(35 10 -96)"/>
      <circle cx="0" cy="-122" r="5" fill="#f4a7b9"/>
      <circle cx="0" cy="-122" r="2" fill="#e8b04a"/>
    </g>
  </defs>

  <!-- céu -->
  <rect width="1200" height="340" fill="url(#sky)"/>

  <!-- estrelas -->
  <g fill="#fff3d6">
    <circle cx="80" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="95" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="22" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="35" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="18" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="110" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="140" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="150" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- lua -->
  <circle cx="1040" cy="70" r="90" fill="url(#moonGlow)"/>
  <circle cx="1040" cy="70" r="34" fill="#fbecc8"/>
  <circle cx="1028" cy="62" r="6" fill="#efd9a8" opacity="0.7"/>
  <circle cx="1052" cy="82" r="4" fill="#efd9a8" opacity="0.7"/>

  <!-- telhados do palácio -->
  <g fill="#14091f">
    <path d="M-20 252 Q60 248 115 226 L300 226 Q355 248 440 252 L420 266 L0 266 Z"/>
    <rect x="30" y="266" width="370" height="80"/>
    <path d="M760 252 Q845 248 900 226 L1085 226 Q1140 248 1220 252 L1220 266 L780 266 Z"/>
    <rect x="800" y="266" width="400" height="80"/>
    <rect x="0" y="318" width="1200" height="22"/>
    <path d="M380 276 Q390 270 400 266 L800 266 Q810 270 820 276 L820 340 L380 340 Z" fill="#1d0d26"/>
    <rect x="390" y="266" width="420" height="4" fill="#3a1530"/>
  </g>
  <g fill="#ffb347" opacity="0.85">
    <rect x="80" y="282" width="18" height="24" rx="2"><animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="150" y="282" width="18" height="24" rx="2"/>
    <rect x="330" y="282" width="18" height="24" rx="2"><animate attributeName="opacity" values="1;0.5;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="860" y="282" width="18" height="24" rx="2"/>
    <rect x="1040" y="282" width="18" height="24" rx="2"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/></rect>
    <rect x="1110" y="282" width="18" height="24" rx="2"/>
  </g>

  <!-- lanternas balançando -->
  <g transform="translate(140 0)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="4s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="70" stroke="#e8b04a" stroke-width="1.5"/>
      <use href="#lantern" y="76"/>
    </g>
  </g>
  <g transform="translate(250 0)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="4 0 0;-4 0 0;4 0 0" dur="5s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#e8b04a" stroke-width="1.5"/>
      <use href="#lantern" y="36" transform="scale(0.8)"/>
    </g>
  </g>
  <g transform="translate(940 0)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 0;4 0 0;-4 0 0" dur="4.6s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#e8b04a" stroke-width="1.5"/>
      <use href="#lantern" y="46"/>
    </g>
  </g>

  <!-- placa central -->
  <g>
    <rect x="345" y="62" width="510" height="178" rx="14" fill="#14091f" opacity="0.35" transform="translate(6 8)"/>
    <rect x="345" y="62" width="510" height="178" rx="14" fill="url(#plaque)"/>
    <rect x="357" y="74" width="486" height="154" rx="9" fill="none" stroke="#c8102e" stroke-width="2.5"/>
    <rect x="364" y="81" width="472" height="140" rx="6" fill="none" stroke="#e8b04a" stroke-width="1.2" stroke-dasharray="6 4"/>
    <!-- cantoneiras -->
    <g fill="#c8102e">
      <circle cx="357" cy="74" r="6"/><circle cx="843" cy="74" r="6"/>
      <circle cx="357" cy="228" r="6"/><circle cx="843" cy="228" r="6"/>
    </g>
    <text x="600" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="5" fill="#3f7a57">✿ PALACE APOTHECARY ✿</text>
    <text x="600" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="bold" fill="#c8102e" letter-spacing="2">ggekkos</text>
    <text x="600" y="203" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#5a2a3a">herbs · jasmine tea · mysteries · poisons (purely out of curiosity)</text>
  </g>

  <!-- ervas nos cantos -->
  <g transform="translate(320 340) scale(0.75)"><use href="#sprig"/></g>
  <g transform="translate(352 340) scale(0.6)"><use href="#sprig"/></g>
  <g transform="translate(880 340) scale(-0.75 0.75)"><use href="#sprig"/></g>
  <g transform="translate(848 340) scale(-0.6 0.6)"><use href="#sprig"/></g>

  <!-- pétalas caindo -->
  <g fill="#f4a7b9">
    <g><animateTransform attributeName="transform" type="translate" values="60 -20;160 360" dur="9s" repeatCount="indefinite"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="230 -20;330 360" dur="11s" begin="-4s" repeatCount="indefinite"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="380 -20;470 360" dur="10s" begin="-7s" repeatCount="indefinite"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.5s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="560 -20;650 360" dur="12s" begin="-2s" repeatCount="indefinite"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="3s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="720 -20;820 360" dur="9.5s" begin="-5s" repeatCount="indefinite"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="880 -20;980 360" dur="10.5s" begin="-8s" repeatCount="indefinite"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="3.2s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="1020 -20;1110 360" dur="11.5s" begin="-3s" repeatCount="indefinite"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.8s" repeatCount="indefinite"/></use></g>
    <g opacity="0.7"><animateTransform attributeName="transform" type="translate" values="0 -20;90 360" dur="13s" begin="-6s" repeatCount="indefinite"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="5s" repeatCount="indefinite"/></use></g>
    <g opacity="0.7"><animateTransform attributeName="transform" type="translate" values="1120 -20;1210 360" dur="12.5s" begin="-9s" repeatCount="indefinite"/><use href="#petal"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.5s" repeatCount="indefinite"/></use></g>
  </g>
</svg>
